:root[data-theme="dark"]{--bg:#2a231c;--card:#352d24;--sand:#41372c;--oat:#6b5a45;--blue:#4d6573;--brown:#d2b08a;--ink:#f1e8da;--line:#4d4234}
html{height:100%;scroll-padding-top:60px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.8 "Noto Sans TC",sans-serif}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 10px}
nav a{white-space:nowrap;padding:5px 12px;border-radius:99px;color:var(--ink);text-decoration:none;font-size:13px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:860px;margin:auto;padding:0 18px 60px}
section{display:none;animation:f .4s}section.on{display:block}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.hero{margin:18px 0;border-radius:24px;min-height:300px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,var(--blue) 0%,#e8e1d0 62%,var(--oat) 100%);color:#3b2d20}
.hero h1{font-size:40px;letter-spacing:.15em}.hero p{margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:12px;color:var(--brown);letter-spacing:.1em}
.chip{display:inline-block;border:1px solid var(--oat);border-radius:99px;padding:3px 12px;margin:3px;color:var(--ink);text-decoration:none;font-size:13px;background:none;cursor:pointer;font-family:inherit}
.chip:hover,.chip.on{background:var(--sand)}
.tl{border-left:1px solid var(--oat);margin:10px 0 10px 8px;padding-left:18px}
.st{position:relative;margin-bottom:18px}.st::before{content:"";position:absolute;left:-24px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--brown)}
.ph{height:170px;border-radius:14px;margin:8px 0;background:linear-gradient(135deg,var(--sand),var(--blue));display:flex;align-items:center;justify-content:center;color:var(--brown);font-size:12px;background-size:cover;background-position:center}
.flag{background:#f3e3c9;color:#6b4a1e;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flag{background:#4b3b24;color:#f0dcb8}}
.meal{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;font-size:14px}.meal b{color:var(--brown);font-weight:400}
input,select,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--oat);border-radius:10px;padding:7px 10px;max-width:100%}
button.b{background:var(--ink);color:var(--bg);cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.row input{flex:1;min-width:90px}
.wall{columns:2 140px;gap:8px}.wall img{width:100%;border-radius:12px;margin-bottom:8px;cursor:zoom-in;display:block}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50}#lb img{max-width:94%;max-height:86%}
.x{cursor:pointer;color:var(--brown);border:0;background:none;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 4px;border-bottom:1px solid var(--line)}

<h3 style="margin:18px 0 6px">⚠ 需要確認的事項</h3>${tb("fgadd()")}${FLAGS.map((f,k)=>EM?`<div class="flag"><textarea style="width:100%" rows="3" oninput="edg(${k},this.value)">${E(f)}</textarea><button class="chip" onclick="fgdel(${k})">刪除</button></div>`:`<div class="flag">${E(f)}</div>`).join("")}
<div class="card"><div class="k">領隊</div>林玉珍 0935-140-797／許錦桃 0932-765-545／MR.小麥 0929-638-099<br>韓國緊急報案 112　<button class="chip" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">切換深淺色</button></div>`,
food:()=>`<div class="row">${tb("fadd()")}</div><div class="flag">以下為依動線的區域參考，營業時間／公休日我無法確認，一律「待確認」，出發前請用 NAVER Map 核對。</div>`+FOOD.map((g,gi)=>`<h3 style="margin-top:18px">${g.z}</h3>`+g.items.map((f,k)=>`<div class="card">${EM?`<input style="width:100%" value="${E(f[0])}" oninput="edf(${gi},${k},0,this.value)">`:`<h3>${f[0]}</h3>`}${ph("f_"+f[0],f[5])}<div>${EM?[[1,"NAVER 搜尋名稱"],[2,"推薦"],[3,"價格"],[4,"營業／公休"],[6,"交通時間"]].map(([n,l])=>`${l}：<input style="width:100%" value="${E(f[n]||(n==6?"待確認":""))}" oninput="edf(${gi},${k},${n},this.value)">`).join(""):`推薦：${f[2]}<br>價格：${f[3]}<br>營業／公休：${f[4]}<br>交通時間：${f[6]||"待確認"}`}</div><a class="chip" target="_blank" href="${N(f[1])}">NAVER Map</a>${EM?`<button class="chip" onclick="fdel(${gi},${k})">刪除</button>`:""}</div>`).join("")).join(""),
budget:()=>`<div class="card"><div class="k">匯率（1 台幣 = ? 韓幣，PDF 參考約 45）</div><div class="row"><input id="rate" type="number" step="0.1" oninput="bset()"><input id="bud" type="number" placeholder="預算（台幣）" oninput="bset()"></div></div>
<div class="card"><div class="row"><input id="bn" placeholder="項目"><input id="ba" type="number" placeholder="金額"><select id="bc"><option>KRW</option><option>TWD</option></select><button class="b" onclick="badd()">新增</button></div><table id="bt"></table><h3 id="bs" style="margin-top:12px"></h3></div>`,
photo:()=>`<div class="row" id="pt">${[1,2,3,4,5].map(n=>`<button class="chip" id="pb${n}" onclick="pday(${n})">DAY ${n}</button>`).join("")}</div><div class="row"><input type="file" id="pf" accept="image/*" multiple onchange="pup(this.files)"></div><div class="wall" id="pw"></div>`,
list:()=>`<div class="card"><div class="row"><input id="ln" placeholder="新增項目"><button class="b" onclick="ladd()">新增</button></div><div id="ll"></div></div>`,
wx:()=>`<div class="flag">為避免顯示不實資料，這裡不放虛構數據。請點下列官方／可靠來源查看氣溫、降雪機率、風速與警報。PDF 參考：11 月釜山約 6–18°C，早晚偏冷。</div>${WX.map(w=>`<a class="chip" target="_blank" href="${w[1]}">${w[0]}</a>`).join("")}`};
let EM=false;{const e0=S("ed",null);if(e0&&e0.days&&e0.food){DAYS.splice(0,DAYS.length,...e0.days);FOOD.splice(0,FOOD.length,...e0.food);if(e0.flags)FLAGS.splice(0,FLAGS.length,...e0.flags)}}
DAYS.forEach((_,i)=>V["d"+i]=()=>dayHTML(i));
function show(){const h=(location.hash||"#home").slice(1),p=V[h]?h:"home";$("m").innerHTML=`<section class="on">${V[p]()}</section>`;
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+p));scrollTo(0,0);({budget:binit,photo:()=>pday(cd),list:lrender})[p]?.();}
$("nav").innerHTML=PAGES.map(p=>`<a href="#${p[0]}">${p[1]}</a>`).join("");addEventListener("hashchange",show);show();
function ph(k,img){const u=S("up",{})[k],src=u||(img?IMG[img]:"");return `<div class="ph" style="${src?`background-image:url(${src})`:""}">${src?"":"照片待加入"}</div><div class="row"><label class="chip">📷 上傳照片<input type="file" accept="image/*" hidden onchange="upl('${k}',this.files[0])"></label>${u?`<button class="chip" onclick="udel('${k}')">還原</button>`:""}</div>`}
function upl(k,f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),z=Math.min(1,800/im.width);c.width=im.width*z;c.height=im.height*z;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const u=S("up",{});u[k]=c.toDataURL("image/jpeg",.7);P("up",u);const y=scrollY;show();scrollTo(0,y)};im.src=r.result};r.readAsDataURL(f)}
function udel(k){const u=S("up",{});delete u[k];P("up",u);const y=scrollY;show();scrollTo(0,y)}
/* 編輯模式 */
function sv(){P("ed",{days:DAYS,food:FOOD,flags:FLAGS})}
function edg(k,v){FLAGS[k]=v;sv()}
function fgdel(k){if(confirm("刪除這條？")){FLAGS.splice(k,1);sv();rr()}}
function fgadd(){FLAGS.push("新的確認事項");sv();rr()}
function rr(){const y=scrollY;show();scrollTo(0,y)}
function EMt(){EM=!EM;rr()}
function tb(add){return `<button class="chip" onclick="EMt()">${EM?"✔ 完成編輯":"✎ 編輯內容"}</button>${EM?`<button class="chip" onclick="${add}">＋新增</button><button class="chip" onclick="edreset()">還原預設</button>`:""}`}
function ed(i,k,v){DAYS[i][k]=v;sv()}
function edm(i,m,v){DAYS[i].meals[m]=v;sv()}
function eds(i,j,k,v){DAYS[i].stops[j][k]=v;sv()}
function edf(g,k,n,v){FOOD[g].items[k][n]=v;sv()}
function stEdit(i,j){const s=DAYS[i].stops[j];return `<div class="st"><div class="card">${[["t","時間"],["n","名稱"],["a","地址"],["s","停留時間"],["dr","前一站車程"],["x","簡介"],["q","NAVER 搜尋名稱"]].map(([k,l])=>`<div class="k">${l}</div><input style="width:100%" value="${E(s[k]||"")}" oninput="eds(${i},${j},'${k}',this.value)">`).join("")}<button class="chip" onclick="stdel(${i},${j})">刪除此景點</button></div></div>`}
function stadd(i){DAYS[i].stops.push({n:"新景點",t:"待確認",x:"",q:"新景點"});sv();rr()}
function stdel(i,j){if(confirm("刪除這個景點？")){DAYS[i].stops.splice(j,1);sv();rr()}}
function fdel(g,k){if(confirm("刪除這間商家？")){FOOD[g].items.splice(k,1);sv();rr()}}
function fadd(){const g=+prompt("加到哪一區？輸入數字\n"+FOOD.map((x,i)=>(i+1)+" "+x.z).join("\n"),1)-1;if(FOOD[g]){FOOD[g].items.push(["新商家","新商家","待確認","待確認","待確認"]);sv();rr()}}
function edreset(){if(confirm("還原成原本內容？所有編輯都會消失")){try{localStorage.removeItem("ed")}catch(e){}location.reload()}}
/* 預算 */
let B=S("bud",{rate:45,total:"",items:[]});
function binit(){$("rate").value=B.rate;$("bud").value=B.total;brender()}
function bset(){B.rate=+$("rate").value||45;B.total=$("bud").value;P("bud",B);brender()}
function badd(){const n=$("bn").value.trim(),a=+$("ba").value;if(!n||!a)return alert("請輸入項目與金額");B.items.push({n,a,c:$("bc").value});P("bud",B);$("bn").value=$("ba").value="";brender()}
function bdel(i){B.items.splice(i,1);P("bud",B);brender()}
function bedit(i){const a=prompt("修改金額",B.items[i].a);if(a&&+a){B.items[i].a=+a;P("bud",B);brender()}}
function brender(){let t=0;$("bt").innerHTML=B.items.map((x,i)=>{const w=x.c=="KRW"?x.a/B.rate:x.a;t+=w;return `<tr><td>${E(x.n)}</td><td>${x.a.toLocaleString()} ${x.c}</td><td>≈ NT$${Math.round(w).toLocaleString()}</td><td><button class="x" onclick="bedit(${i})">✎</button><button class="x" onclick="bdel(${i})">✕</button></td></tr>`}).join("");
$("bs").innerHTML=`總花費 NT$${Math.round(t).toLocaleString()}（₩${Math.round(t*B.rate).toLocaleString()}）`+(B.total?`<br>預算差額 NT$${Math.round(B.total-t).toLocaleString()}（${B.total-t>=0?"尚餘":"超支"}）`:"")}
/* 相簿 */
let cd=1;const IDB=indexedDB;
function pall(){return S("photos",{})}

function pup(fs){[...fs].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,900/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const p=pall();(p[cd]=p[cd]||[]).push(c.toDataURL("image/jpeg",.7));P("photos",p);pday(cd)};im.src=r.result};r.readAsDataURL(f)})}
